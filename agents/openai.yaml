name: High Fidelity Web Product Design
version: 1.0.0
description: Turn own website ideas and reference websites into a high-fidelity canonical web design spec, renders, Figma prototype contract, frontend implementation spec, and QA loop.
entrypoint: SKILL.md
category: design-development
suggested_model_behavior:
  - preserve_canonical_spec_as_source_of_truth
  - use_reference_sites_as_pattern_evidence_not_copy_targets
  - produce_figma_contract_when_figma_is_not_authenticated
  - prefer_code_connect_when_available_for_design_to_code
optional_tools:
  browser:
    - Playwright MCP
    - Chrome DevTools MCP
  image:
    - Codex image skill
    - image generation
  design:
    - Figma MCP remote
    - Figma MCP desktop
    - Figma REST API
    - Code Connect
  qa:
    - Playwright
    - axe-core
    - Lighthouse
fallbacks:
  no_browser_tool: scripts/collect-page-signals.mjs
  no_image_tool: output_render_prompts_only
  no_figma_auth: output_figma_generation_contract_only
  no_code_connect: output_component_contracts_and_frontend_spec
